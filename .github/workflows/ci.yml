name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  selftest:
    name: 离屏自测（qt/selftest.py）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install PySide6 pyqtgraph numpy pyserial
      - name: 运行离屏自测
        env:
          QT_QPA_PLATFORM: offscreen
        run: python qt/selftest.py

  build-exe:
    name: 打包 liuscope.exe（仅 tag）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install PySide6 pyqtgraph numpy pyserial pyinstaller
      - name: PyInstaller 单文件打包
        run: python -m PyInstaller --noconfirm --onefile --windowed --paths qt --name liuscope --icon qt/assets/liuscope.ico --add-data "qt/assets;assets" --collect-submodules serial qt/main.py
      - name: 打包产物冒烟（冻结安全子集，退出码门禁）
        env:
          QT_QPA_PLATFORM: offscreen
        # v1.3.0 起组数扩到 42（冻结子集），逐像素断言在冻结模式约 10~15 分钟——放宽到 30
        timeout-minutes: 30
        run: ./dist/liuscope.exe --selftest-exit
      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/liuscope.exe -Algorithm SHA256).Hash.ToLower()
          "$h  liuscope.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: liuscope-exe
          path: |
            dist/liuscope.exe
            dist/SHA256SUMS.txt
