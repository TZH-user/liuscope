<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 候选 B「柳岸水波」v2：细长柳叶挂丝 + 水面波形 + 倒影 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E82CC"/>
      <stop offset="0.52" stop-color="#1B66A4"/>
      <stop offset="0.62" stop-color="#14508A"/>
      <stop offset="1" stop-color="#0A2A50"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2FBEF"/>
      <stop offset="1" stop-color="#8AD9C0"/>
    </linearGradient>
    <path id="lf" d="M0 0 C 4.6 7, 4.6 17, 0 25 C -4.6 17, -4.6 7, 0 0 Z"/>
    <clipPath id="round"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
    <clipPath id="water"><rect x="8" y="162" width="240" height="86"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="8" y="8" width="240" height="240" fill="url(#sky)"/>
    <!-- 横枝 -->
    <path d="M6 42 C 66 28, 180 28, 250 46" fill="none" stroke="#8FC3E8" stroke-width="9" stroke-linecap="round" opacity="0.92"/>
    <!-- 垂柳丝 -->
    <g fill="none" stroke="#E8F6FF" stroke-linecap="round">
      <path d="M42 38 C 38 72, 30 104, 18 132" stroke-width="4.6" opacity="0.9"/>
      <path d="M76 34 C 76 76, 66 116, 50 152" stroke-width="5.2" opacity="0.85"/>
      <path d="M112 32 C 114 78, 108 122, 94 160" stroke-width="5.8" opacity="0.95"/>
      <path d="M148 31 C 152 74, 148 116, 136 150" stroke-width="5.2" opacity="0.85"/>
      <path d="M131 31 C 128 68, 122 104, 112 134" stroke-width="4.4" opacity="0.7"/>
      <path d="M26 40 C 22 66, 16 88, 10 104" stroke-width="3.6" opacity="0.6"/>
      <path d="M184 33 C 190 70, 188 106, 178 138" stroke-width="4.6" opacity="0.9"/>
      <path d="M218 38 C 224 66, 224 94, 216 120" stroke-width="4.2" opacity="0.72"/>
    </g>
    <!-- 柳叶：细长梭形，挂在柳丝上，顺下垂方向左右交错 -->
    <g fill="url(#leaf)" stroke="#6FBFA8" stroke-width="0.8" stroke-opacity="0.5">
      <use href="#lf" transform="translate(40,58) rotate(24)"/>
      <use href="#lf" transform="translate(64,74) rotate(-26) scale(0.9)"/>
      <use href="#lf" transform="translate(70,118) rotate(28) scale(0.85)"/>
      <use href="#lf" transform="translate(52,140) rotate(-22) scale(0.8)"/>
      <use href="#lf" transform="translate(107,52) rotate(-24)"/>
      <use href="#lf" transform="translate(120,86) rotate(26) scale(0.95)"/>
      <use href="#lf" transform="translate(104,128) rotate(-28) scale(0.85)"/>
      <use href="#lf" transform="translate(143,58) rotate(22) scale(0.9)"/>
      <use href="#lf" transform="translate(152,100) rotate(-26) scale(0.85)"/>
      <use href="#lf" transform="translate(140,136) rotate(24) scale(0.8)"/>
      <use href="#lf" transform="translate(182,54) rotate(-24) scale(0.85)"/>
      <use href="#lf" transform="translate(190,96) rotate(24) scale(0.8)"/>
      <use href="#lf" transform="translate(222,58) rotate(20) scale(0.75)"/>
      <use href="#lf" transform="translate(126,44) rotate(24) scale(0.8)"/>
      <use href="#lf" transform="translate(118,74) rotate(-24) scale(0.8)"/>
      <use href="#lf" transform="translate(160,24) rotate(20) scale(0.7)"/>
      <use href="#lf" transform="translate(30,60) rotate(26) scale(0.7)"/>
      <use href="#lf" transform="translate(96,142) rotate(26) scale(0.75)"/>
    </g>
    <!-- 水下倒影：柳丝镜像（压扁） -->
    <g clip-path="url(#water)" fill="none" stroke="#BFE2F7" stroke-linecap="round" opacity="0.14"
       transform="translate(0,294) scale(1,-0.55)">
      <path d="M112 32 C 114 78, 108 122, 94 160" stroke-width="7"/>
      <path d="M148 31 C 152 74, 148 116, 136 150" stroke-width="6"/>
    </g>
    <!-- 水线即示波轨迹（辉光双描） -->
    <path d="M22 166 Q 40 142, 58 166 T 94 166 T 130 166 T 166 166 T 202 166 T 236 166"
          fill="none" stroke="#7FE0FF" stroke-width="13" opacity="0.22" stroke-linecap="round"/>
    <path d="M22 166 Q 40 142, 58 166 T 94 166 T 130 166 T 166 166 T 202 166 T 236 166"
          fill="none" stroke="#9FEAFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  </g>
</svg>
